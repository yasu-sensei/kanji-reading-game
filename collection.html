<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#171d39">
  <link rel="stylesheet" href="css/rewards.css">
  <script src="js/cards.js" defer></script>
  <script src="js/game-store.js" defer></script>
  <script src="js/rewards.js" defer></script>
  <title>なかまのずかん | かんじの ぼうけん</title>
</head>
<body data-page="collection">
  <a class="skip-link" href="#main">ほんぶんへ</a>
  <header class="site-header">
    <a class="brand" href="index.html"><span aria-hidden="true">✦</span> かんじの ぼうけん</a>
    <nav aria-label="メニュー">
      <a href="index.html">かんじ</a>
      <a href="gacha.html" >ガチャ</a>
      <a href="collection.html" aria-current="page">ずかん</a>
    </nav>
  </header>
  <main id="main">
    <p class="trial-note" id="profile-note"></p>
    <p id="storage-message" class="notice" role="status" aria-live="polite"></p>
    <div class="page-heading"><div><p class="eyebrow">がんばったぶん、たからものが ふえる。</p><h1>なかまのずかん</h1><p>カードを タップすると、おおきく みられるよ。</p></div><a class="secondary-button" href="gacha.html">ガチャを ひく <span aria-hidden="true">→</span></a></div>
    <section class="collection-progress" aria-label="あつめたカード">
      <div><span>あつめた カード</span><strong><span id="collection-count">0</span><small> / 99まい</small></strong></div>
      <progress id="collection-progress" max="99" value="0" aria-label="99まいまでの すすみぐあい"></progress>
      <p>33しゅるい × 3つの かがやき。ぜんぶ あつめられるかな？</p>
    </section>
    <div class="collection-toolbar"><div id="tier-filters" class="filter-group" role="group" aria-label="カードのしゅるい"><button type="button" data-filter="all" aria-pressed="true">ぜんぶ</button><button type="button" data-filter="normal" aria-pressed="false">ノーマル</button><button type="button" data-filter="gold" aria-pressed="false">ゴールド</button><button type="button" data-filter="rainbow" aria-pressed="false">レインボー</button></div><label class="owned-filter"><input id="owned-only" type="checkbox"> もっているカード</label></div>
    <p id="album-summary" role="status" aria-live="polite"></p>
    <div id="album-grid" class="album-grid"></div>
    <p id="album-empty" class="album-empty" hidden>まだ このカードは ないよ。<a href="gacha.html">ガチャで なかまを さがそう。</a></p>
  </main>
  <dialog id="card-dialog" class="card-dialog" aria-labelledby="detail-name"><button id="close-detail" type="button" class="close-button" aria-label="カードをとじる">×</button><div id="detail-card"></div><p id="detail-tier" class="eyebrow"></p><h2 id="detail-name"></h2><p id="detail-count"></p><button id="detail-done" type="button" class="secondary-button">ずかんに もどる</button></dialog>
  <footer class="site-footer">
    <p>カードは、とうろくした くみ・ばんごうごとに、このブラウザーに ほぞんするよ。</p>
    <details data-demo-only><summary>おとなの方へ</summary><p>この画面は表示・操作確認用です。学習による星の付与、児童別管理、本番の排出率は未連携です。</p><button id="reset-demo" class="text-button" type="button">おためしの記録をリセット</button></details>
  </footer>
  <noscript><p class="notice">JavaScriptを有効にすると、カードをあつめられます。</p></noscript>
</body>
</html>
