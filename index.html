<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>かんじの じゅんび | 漢字読み方ゲーム</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/preparation.js" defer></script>
</head>
<body>
  <main>
    <header>
      <p class="eyebrow">かんじ よみかた ゲーム</p>
      <h1>かんじの じゅんび</h1>
      <p id="instructions">ならった かんじを タップしてね。<br>もういちど タップすると はずせるよ。</p>
    </header>
    <section aria-label="かんじを えらぶ">
      <p id="selection-count" class="count" role="status" aria-live="polite"></p>
      <div id="kanji-list" class="kanji-list" role="group" aria-describedby="instructions"></div>
      <p id="save-status" role="status" aria-live="polite"></p>
    </section>
    <aside>
      <p>えらんだ かんじは、この ブラウザーに のこるよ。</p>
      <p>みんなで つかう ときは、じぶんの かんじを えらびなおしてね。</p>
      <p>ゲームは じゅんびちゅうです。</p>
    </aside>
    <noscript>かんじを えらぶには、JavaScript を ゆうこうに してください。</noscript>
  </main>
</body>
</html>
