.reading-reinforcement { background: #fff; text-align: center; padding: 12px; overflow-wrap: anywhere; }

/* Reserve the same word, verdict and reading space before and after an answer. */

.answer-display .feedback { margin: 8px 0 0; min-height: 48px; }

.buttons { max-width: 100%; }
.buttons > button { flex: 0 0 auto; white-space: nowrap; min-height: 48px; }

.gold-star { color: #936600; }

body.title-mode { background: #111525; }

.visually-hidden { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

    render(); // 正誤はタップした処理内ですぐ表示。
    if (current.answers.length === current.items.length) { await commitGame(); if (game !== current) return; render(); }
    cancelTimer();
    timer = setTimeout(() => { if (screen !== "play" || game !== current) return; feedback = null; kanaInput = ""; game.idx++; if (game.idx >= game.items.length) screen = "result"; render(); }, ok ? (current.kanaMode ? 1000 : 1500) : 2000);
  }
  async function retryCommit() { if (await commitGame()) warning = ""; render(); }
  async function quit() {
    if (game?.committed) { nav("result"); return; }
    if (!game) return;
    const current = game;
    if (current.mode === "teacherTest") { cancelTimer(); game = review = feedback = null; kanaInput = ""; screen = "select"; render(); return; }
    const isPractice = current.mode === "practice";
    if (!confirm(isPractice ? "とちゅうで やめる？ しろ☆は もらえないけれど、きょうの 5かいの うち 1かいに かぞえるよ。" : "とちゅうで やめる？ さいごまで おわっていないと きろくは のこらないよ。")) return;
    cancelTimer();
    if (isPractice) {
      const ok = await update(next => {
        const u = store.profile(next, current.profile);
        if (u.log.some(log => log.id === current.id)) return;
        if (practiceToday(u) >= 5) throw new Error("きょうの しゅぎょうは 5かい おわっています。");
        u.log.push({ id: current.id, date: new Date().toISOString(), mode: "practice", score: null, award: 0, aborted: true });
      });
      if (!ok) { render(); return; }
    }
    if (game !== current) return;
    game = review = feedback = null; screen = "select"; render();
  }
  function startReview() {
    if (!game?.committed) return;
    const missed = game.items.filter((q, i) => !game.answers[i].ok);
    const unique = [...new Map(missed.map(q => [q.id, q])).values()];
    if (!unique.length) return;
    review = { round: 1, items: shuffle(unique.map(q => ({ ...q, opts: shuffle([q.r, ...q.wrong]) }))), idx: 0, failed: [] };
    kanaInput = ""; feedback = null; screen = "review"; render();
  }
  function reviewAnswer(index) {
    if (feedback || screen !== "review") return;
    const q = review.items[review.idx], ok = q.opts[index] === q.r;
    reviewRecord(ok, index);
  }
  function reviewRecord(ok, choice) {
    if (feedback || screen !== "review") return;
    const q = review.items[review.idx];
    feedback = { ok, choice }; if (!ok) review.failed.push(q); render(); cancelTimer();
    timer = setTimeout(() => {
      if (screen !== "review") return;
      feedback = null; kanaInput = ""; review.idx++;
      if (review.idx >= review.items.length) {
        if (review.round === 1 && review.failed.length) review = { round: 2, items: shuffle(review.failed.map(q => ({ ...q, opts: shuffle([q.r, ...q.wrong]) }))), idx: 0, failed: [] };
        else { game.reviewFinished = true; screen = "reviewDone"; }
      }
      render();
    }, ok ? (game?.kanaMode ? 1000 : 1500) : 2000);
  }
  function nav(to) { cancelTimer(); feedback = review = null; if (to !== "result") game = null; screen = to; warning = ""; render(); }
  function goRewards(page) { cancelTimer(); location.href = page + ".html"; }
  function repeatTrainingButton() {
    if (game?.mode !== "practice" || !game.committed) return "";
    if (practiceToday(user()) >= 5) return '<p class="reward-rule">きょうの しゅぎょうは 5かい おわったよ。また あした！</p>';
    return b("もういちど しゅぎょう", "begin('practice')", "primary full");
  }
  function render() {
    document.body.classList.toggle("title-mode", !loginVisible);
    if (!loginVisible) {
      app.innerHTML = `<section class="title-screen" aria-label="かん字 ファンタジア"><div class="title-art"><img src="https://yasu-sensei.github.io/kanji-reading-game/images/login-fantasia.jpg" alt="かん字 ファンタジア。月明かりの魔法の図書館" fetchpriority="high"><button type="button" class="title-start" onclick="showLogin()" aria-label="ゲームをはじめる"><span class="visually-hidden">ゲームをはじめる</span></button></div></section>`;
      return;
    }
    let html = `<h1>🌸 かん字ファンタジア</h1>`;
    if (warning) html += `<div class="notice" role="alert">${esc(warning)}</div>`;
    if (!data.active) {
      html += `<section class="card stack"><h2>はじめに おしえてね</h2><div class="login"><label>なんくみ？<select id="cls"><option value="">えらぶ</option>${Array.from({ length: 4 }, (_, i) => `<option value="${i + 1}">${i + 1}くみ</option>`).join("")}</select></label><label>なんばん？<select id="num"><option value="">えらぶ</option>${Array.from({ length: 35 }, (_, i) => `<option value="${i + 1}">${i + 1}ばん</option>`).join("")}</select></label></div>${b("はじめる", "startLogin()", "primary full")}<p class="muted">記録はこの端末のブラウザー内に保存します。別の端末への引き継ぎ・先生のサーバーとは未連携です。</p></section>`;
      app.innerHTML = html; return;
    }
    const u = user();
    html += `<div class="row user-header"><span class="badge">${esc(data.active.replace("-", "くみ "))}ばん</span><span class="badge" id="learning-stars"><span class="gold-star" aria-hidden="true">★</span> きん☆ ${u.stars}こ</span><span class="badge" id="white-stars"><span class="white-star" aria-hidden="true">★</span> しろ☆ ${u.practice}こ</span>${b("とうろく きりかえ", "changeUser()", "small secondary")}</div>`;
    if (screen === "home") screen = "select";
    if (screen === "select") html += `<section class="card"><h2>① ならった かんじを えらぼう！</h2><p class="muted">タッチで えらぶ・もういちどで はずす</p><div class="row"><span class="badge">${u.selected.length} / 80じ</span><div class="buttons">${b("ぜんぶ えらぶ", "selectAll(true)", "small secondary")}${b("ぜんぶ はずす", "selectAll(false)", "small secondary")}</div></div><div class="grid">${KANJI.map(k => `<button type="button" class="kanji ${u.selected.includes(k) ? "on" : ""}" aria-label="${k}" aria-pressed="${u.selected.includes(k)}" onclick="toggle('${k}')" ${saving ? "disabled" : ""}>${k}</button>`).join("")}</div><p class="muted">えらんだ かんじの ことば：${available().length}もん</p></section><section class="card stack"><h2>② モードを えらぼう！</h2><p class="reward-rule" id="kana-unlock-status">📖 ずかんの カード：${unlockedCards(u)} / 50まい　｜　${unlockedCards(u) >= 50 ? "⌨️ 50おんキーボード かいほう！" : "あと " + (50 - unlockedCards(u)) + "まいで 50おんキーボード"}</p><p>🏠 ちょうせんモード：1にち 1かい（20もん）</p><p class="reward-rule">20もん ぜんぶ せいかいで きん☆ 2こ！<br>10〜19もん せいかいで きん☆ 1こ。</p><button type="button" class="primary full" onclick="begin('homework')" ${u.lastHomework === today() || saving ? "disabled" : ""}>${u.lastHomework === today() ? "✓ きょうの ちょうせんは おわったよ" : "ちょうせんを はじめる"}</button><p>✏️ しゅぎょうモード：1にち 5かいまで（1かい 10もん・とちゅうで やめても 1かい）（きょう あと ${Math.max(0, 5 - practiceToday(u))}かい）</p><p class="reward-rule">10もんの うち はじめの こたえで 9もん いじょう せいかいすると しろ☆ 1こ！<br>8もん いかでも、とちゅうで やめても 1にち 5かいの うち 1かいに かぞえるよ。<br>しろ☆ 5こで きん☆ 1こに なるよ。</p><p>いま しろ☆ ${u.practice}こ。あと ${5 - u.practice}こで きん☆ 1こ！</p><button type="button" class="full secondary" onclick="begin('practice')" ${practiceToday(u) >= 5 || saving ? "disabled" : ""}>${practiceToday(u) >= 5 ? "✓ きょうの しゅぎょうは おわったよ" : "しゅぎょうを はじめる"}</button><p>📚 むげんれんしゅうモード：1セット 10もん</p><p class="reward-rule">1にち なんかいでも できるよ。<br>きん☆・しろ☆は もらえないよ。</p>${b("むげんれんしゅうを はじめる", "begin('free')", "full secondary")}${teacherTestAccess ? `<div class="teacher-test-panel"><h3>先生用 50音入力テスト</h3><p>カード0枚でも確認できます。星・カード・学習履歴は変更しません。テストは20問です。</p>${b("50音入力をテストする", "begin('teacherTest')", "primary full")}</div>` : ""}<div class="result-links">${b("🎁 ガチャ", "goRewards('gacha')", "full")}${b("📖 ずかん", "goRewards('collection')", "full")}</div></section>`;
    if (screen === "play" || screen === "review") {
      const isReview = screen === "review", q = isReview ? review.items[review.idx] : game.items[game.idx];
      const num = isReview ? review.idx + 1 : game.idx + 1, max = isReview ? review.items.length : game.items.length;
      const typing = !!game?.kanaMode;
      const kanaStatus = game.mode === "homework" ? `<span class="kana-mode-status">カード ${unlockedCards(u)}まい・${typing ? "50おん" : "3たく"}</span>` : "";
      html += `<section class="card play-card ${typing ? "kana-play" : ""}" data-question-id="${q.id}"><div class="question-toolbar"><strong>${isReview ? "ふくしゅう " + review.round + "かいめ" : game.mode === "homework" ? "ちょうせん" : game.mode === "teacherTest" ? "せんせい テスト" : game.mode === "practice" ? "しゅぎょう" : "むげんれんしゅう"} ${num} / ${max}</strong>${kanaStatus}${b("やめる", isReview ? "nav('result')" : "quit()", "small secondary")}</div><div class="progress" role="progressbar" aria-label="こたえた もんだい" aria-valuemin="0" aria-valuemax="${max}" aria-valuenow="${num - 1}"><div style="width:${(num - 1) / max * 100}%"></div></div><div class="answer-display"><div class="feedback ${feedback ? feedback.ok ? "good" : "bad" : ""}" role="status" aria-live="polite">${feedback ? feedback.ok ? "○ せいかい！" : "× たしかめよう" : ""}</div><div class="question remember-word">${typing ? esc(q.w) : questionWord(q)}</div><div class="reading-slot"><div class="remember-reading" ${feedback ? "" : 'style="visibility:hidden" aria-hidden="true"'}>${esc(q.r)}</div>${feedback ? "" : `<p class="muted reading-prompt">${typing ? "つぎの かん字の よみかたを いれよう" : "ただしい よみかたを えらぼう！"}</p>`}</div></div><div class="choices">${typing ? `<div class="kana-answer-row"><div id="kana-answer" class="kana-answer ${kanaInput ? "" : "empty"}">${esc(kanaInput || "よみかたを いれてね")}</div></div>${kanaKeyboard()}` : q.opts.map((option, i) => `<button type="button" ${feedback ? "disabled" : ""} class="choice ${feedback ? option === q.r ? "correct" : i === feedback.choice ? "wrong" : "" : ""}" onclick="${isReview ? "reviewAnswer" : "answer"}(${i})">${esc(option)}</button>`).join("")}</div></section>`;
    }
    if (screen === "result") {
      const score = game.answers.filter(a => a.ok).length, missed = game.items.length - score;
      html += `<section class="card stack"><h2>けっか はっぴょう！</h2><div class="big">${score} / ${game.items.length}</div><div class="big star">${game.mode === "free" || game.mode === "teacherTest" ? "" : game.committed && game.mode === "practice" ? (score >= 9 ? '<span class="white-star">★</span>' : '☆') : "★".repeat(game.awarded) || "☆"}</div><p style="text-align:center">${game.committed ? game.mode === "teacherTest" ? "先生用テスト終了。星・カード・学習履歴は保存していません。" : game.mode === "free" ? "きろくを ほぞんしたよ。むげんれんしゅうでは ☆は ふえないよ。" : game.mode === "practice" ? (score >= 9 ? "9もん いじょう せいかい！ しろ☆ 1こ もらったよ！" + (game.awarded ? " しろ☆ 5こを きん☆ 1こに かえたよ！" : " あと " + (5 - u.practice) + "こで きん☆ 1こ！") : "こんかいは しろ☆ なし。1にち 5かいの うち 1かいに かぞえたよ。") : "きろくを ほぞんしたよ。こんかいの きん☆：" + game.awarded + "こ" : "まだ ほぞんできていません。"}</p>${!game.committed ? b("もういちど ほぞんする", "retryCommit()", "primary full") : ""}${missed && game.committed && !game.reviewFinished ? b("まちがえた もんだいを ふくしゅう", "startReview()", "primary full") : ""}${repeatTrainingButton()}${b("かんじを えらぶ がめんへ", "nav('select')", "secondary full")}<div class="result-links">${b("🎁 ガチャ", "goRewards('gacha')")}${b("📖 ずかん", "goRewards('collection')")}</div></section>`;
    }
    if (screen === "reviewDone") html += `<section class="card stack"><h2>ふくしゅう おしまい！</h2><p>がんばったね！ つぎも ちょうせんしよう。</p>${repeatTrainingButton()}${b("じゅんびがめんへ", "nav('select')", "primary full")}</section>`;
    html += `<p class="foot">400問の提供CSVを使用｜学級・番号別の端末内保存｜別端末への同期は未連携</p>`;
    app.innerHTML = html;
  }
  async function initialize() {
    try {
      const response = { ok: true, text: async () => window.__KANJI_CSV__ };
      QUESTIONS = window.KanjiQuestions.parseQuestions(await response.text()).map(q => ({ id: q.id, k: q.target, w: q.word, r: q.correct, wrong: q.choices.slice(1) }));
      KANJI = [...new Set(QUESTIONS.map(q => q.k))]; data = store.read(); render();
    } catch { app.innerHTML = `<section class="card"><h1>じゅんびを たしかめよう</h1><p>もんだい または きろくを よみこめませんでした。おとなの方に しらせてね。きろくは けしていません。</p><button type="button" onclick="location.reload()">もういちど よみこむ</button></section>`; }
  }
  Object.assign(window, { showLogin, startLogin, changeUser, toggle, selectAll, begin, answer, retryCommit, quit, startReview, reviewAnswer, kanaKey, kanaSubmit, nav, goRewards });
  window.addEventListener("storage", event => { if (event.key !== store.key && event.key !== null) return; try { const next = store.read(); if (next.active !== data.active) { cancelTimer(); game = review = feedback = null; screen = "home"; } data = next; render(); } catch { warning = "きろくの へんこうを よみこめません。"; render(); } });
  initialize();
})();

</script></body></html>
